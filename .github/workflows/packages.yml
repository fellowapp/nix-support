name: Packages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_FLOX_VERSION: '1.17.0'
  NIX_CONFIG: 'extra-experimental-features = nix-command flakes'

concurrency:
  group: packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      flox_version: ${{ steps.matrix.outputs.flox_version }}
      plans: ${{ steps.plan.outputs.plans }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the shared nixpkgs pin is in the Flox catalog
        run: |
          curl --fail --silent --show-error --retry 3 \
            https://api.flox.dev/api/v1/catalog/info/base-catalog \
            --output "$RUNNER_TEMP/flox-catalog.json"
          jq -e --slurpfile lock flake.lock '
            $lock[0].nodes.nixpkgs.locked as $pin |
            .base_url == ("https://github.com/" + $pin.owner + "/" + $pin.repo) and
            any(.scraped_pages[]; .rev == $pin.rev)
          ' "$RUNNER_TEMP/flox-catalog.json" > /dev/null
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Map supported Nix systems to CI runners
        id: matrix
        run: |
          systems=$(nix eval --json --file nix/systems.nix)
          platforms=$(jq -nc --argjson systems "$systems" '
            {"x86_64-linux": "ubuntu-24.04", "aarch64-linux": "ubuntu-24.04-arm",
             "x86_64-darwin": "macos-15-intel", "aarch64-darwin": "macos-15"} as $runners |
            {include: [$systems[] | {system: ., runner: $runners[.]}]}
          ')
          {
            echo "platforms=$platforms"
            echo "flox_version=$CI_FLOX_VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: Test publication selection and recovery
        run: bash tests/publication.sh
      - name: Reserve release identities and original source commits
        id: plan
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for recipe in .flox/pkgs/*.nix; do
            package=${recipe##*/}
            package=${package%.nix}
            directory="$RUNNER_TEMP/package-plan/$package"
            mkdir -p "$directory"
            nix eval --json --file nix/release.nix --apply "release: release { package = \"$package\"; }" > "$directory/metadata.json"
            PACKAGE="$package" bash scripts/publish-package.sh prepare "$directory"
          done
          plans=$(jq -sc '.' "$RUNNER_TEMP"/package-plan/*/plan.json)
          {
            echo "plans=$plans"
            echo "pending=$(jq 'any(.[]; .pending)' <<< "$plans")"
          } >> "$GITHUB_OUTPUT"

  platform:
    needs: prepare
    name: Packages (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    # PR checks use an environment without publishing secrets or branch restrictions.
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'flox' || 'package-checks' }}
    permissions:
      contents: write
    env:
      SYSTEM: ${{ matrix.system }}
      NIX_SSL_CERT_FILE: ${{ endsWith(matrix.system, '-darwin') && '/etc/ssl/cert.pem' || '/etc/ssl/certs/ca-certificates.crt' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2
        with:
          version: ${{ needs.prepare.outputs.flox_version }}
      - name: Check formatting
        if: matrix.system == 'x86_64-linux'
        run: nix fmt -- --check flake.nix pkgs/*.nix nix/*.nix .flox/pkgs/*.nix
      - name: Check that unrelated changes preserve package versions
        if: matrix.system == 'x86_64-linux'
        run: bash tests/package-identity.sh
      - name: Build and check every Flox package
        run: bash scripts/publish-package.sh build "$RUNNER_TEMP/package-build"
      - uses: actions/upload-artifact@v4
        with:
          name: package-build-${{ matrix.system }}
          path: ${{ runner.temp }}/package-build/
          if-no-files-found: error
      - name: Compare built outputs and publish missing platform receipts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PLANS: ${{ needs.prepare.outputs.plans }}
          FLOX_FLOXHUB_TOKEN: ${{ secrets.FLOX_FLOXHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for package in $(jq -r '.[] | select(.source != null) | .package' <<< "$PLANS"); do
            git checkout --detach "$GITHUB_SHA"
            directory="$RUNNER_TEMP/package-build/$package"
            jq .metadata "$directory/$SYSTEM.json" > "$directory/metadata.json"
            PACKAGE="$package" bash scripts/publish-package.sh verify-built "$directory"
            pending=$(jq -r --arg package "$package" '.[] | select(.package == $package) | .pending' <<< "$PLANS")
            if [[ $pending != true ]]; then
              echo "$package ($SYSTEM): published output is unchanged"
              continue
            fi
            source=$(jq -r --arg package "$package" '.[] | select(.package == $package) | .source' <<< "$PLANS")
            git switch -C flox-publish "$source"
            git branch --set-upstream-to=origin/main flox-publish
            PACKAGE="$package" bash scripts/publish-package.sh publish "$directory"
          done

  checks:
    name: Package checks
    if: always()
    needs: [prepare, platform]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all native builds and checks
        env:
          PREPARE: ${{ needs.prepare.result }}
          PLATFORM: ${{ needs.platform.result }}
        run: '[[ "$PREPARE" == success && "$PLATFORM" == success ]]'

  release:
    needs: [prepare, checks]
    if: needs.prepare.outputs.pending == 'true' && needs.checks.result == 'success'
    name: Complete package releases
    runs-on: ubuntu-24.04
    environment: flox
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2
        with:
          version: ${{ needs.prepare.outputs.flox_version }}
      - name: Verify catalog resolution and complete pending releases
        env:
          PLANS: ${{ needs.prepare.outputs.plans }}
          FLOX_FLOXHUB_TOKEN: ${{ secrets.FLOX_FLOXHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for package in $(jq -r '.[] | select(.pending) | .package' <<< "$PLANS"); do
            source=$(jq -r --arg package "$package" '.[] | select(.package == $package) | .source' <<< "$PLANS")
            git checkout --detach "$source"
            PACKAGE="$package" bash scripts/publish-package.sh finish
          done
